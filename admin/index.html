<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#111522">
  <title>Cosmic Quest — Mission Control Admin</title>
  <style>
    :root {
      color-scheme: dark light;
      --bg: #111522;
      --card: #1b2031;
      --surface: #22283b;
      --text: #f2f2fa;
      --muted: #a0a7bd;
      --border: #333b52;
      --accent: #b4a0ff;
      --accent-bg: #302a49;
      --green: #77dfac;
      --green-bg: #203b34;
      --red: #ff939e;
      --red-bg: #422a36;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f5f4fa; --card: #fff; --surface: #f7f7fc; --text: #242338; --muted: #6a6980; --border: #e4e2ef; --accent: #7254cf; --accent-bg: #eee8fc; --green: #19764b; --green-bg: #e8f7ee; --red: #bb3448; --red-bg: #ffedf0; }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      min-height: 100svh;
      padding: 40px 20px 28px;
      background: radial-gradient(ellipse at 50% 0, #29213d66, transparent 55%), var(--bg);
      color: var(--text);
      font: 15px/1.6 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    button:focus-visible, input:focus-visible, .table-wrap:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    main { width: min(100%, 860px); margin: auto; }
    header { text-align: center; margin-bottom: 26px; }
    .brand { color: var(--accent); font-size: 12px; font-weight: 750; letter-spacing: 2.4px; text-transform: uppercase; }
    h1 { margin: 10px 0 4px; font-size: clamp(26px, 6vw, 34px); line-height: 1.25; letter-spacing: -1px; }
    h2 { margin: 0 0 12px; font-size: 17px; }
    .subtitle { margin: 0; color: var(--muted); }
    a { color: var(--accent); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 22px; margin-bottom: 20px; }
    .btn { padding: 9px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-weight: 600; cursor: pointer; }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .toolbar h2 { margin: 0; }
    .toolbar-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; }
    .toggle input { width: 16px; height: 16px; accent-color: var(--accent); }
    .live { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 1.2px; font-weight: 650; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
    .live.on .live-dot { background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; margin-bottom: 16px; }
    .stat { padding: 10px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
    .stat-label { display: block; color: var(--text); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
    .stat-value, .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-variant-numeric: tabular-nums; }
    .stat-value { font-size: 20px; color: var(--accent); font-weight: 650; }
    .status { min-height: 1.6em; margin: 0 0 12px; font-size: 13px; color: var(--muted); }
    .error { color: var(--red); }
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { background: var(--surface); font-size: 12px; text-transform: uppercase; letter-spacing: .8px; }
    td.name { white-space: normal; overflow-wrap: anywhere; min-width: 120px; }
    td.num, th.num { text-align: right; }
    tbody tr:last-child td { border-bottom: 0; }
    tr.new td { background: var(--green-bg); }
    .badge { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 4px; color: var(--text); border: 1px solid var(--green); font-size: 11px; font-weight: 700; }
    .empty { padding: 18px; color: var(--muted); text-align: center; }
    dialog { width: min(100% - 40px, 360px); padding: 24px; background: var(--card); color: var(--text); border: 1px solid var(--border); border-top: 2px solid var(--accent); border-radius: 14px; }
    dialog::backdrop { background: #0b0e18d9; }
    dialog h2 { margin-bottom: 14px; }
    .gate-form { display: grid; gap: 10px; }
    .gate-form label { font-size: 13px; font-weight: 600; }
    .gate-form input { width: 100%; padding: 9px 12px; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 8px; }
    .gate-error { min-height: 1.5em; margin: 0; font-size: 13px; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="brand">Cosmic Quest · Mission Control</div>
      <h1>Scoreboard</h1>
      <p class="subtitle">Highest score first, then fastest quiz time. Equal scores and times favor the earlier submission. <a href="../index.html">Back to the quiz</a></p>
    </header>

    <section class="card" id="dashboard" aria-labelledby="dashboard-title" hidden>
      <div class="toolbar">
        <h2 id="dashboard-title" tabindex="-1">Top submissions</h2>
        <div class="toolbar-actions">
          <span class="live" id="live"><span class="live-dot" aria-hidden="true"></span><span id="live-text">Paused</span></span>
          <label class="toggle"><input type="checkbox" id="auto-refresh" checked> Auto-refresh (10s)</label>
          <button type="button" class="btn" id="refresh">Refresh now</button>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><span class="stat-label">Submissions</span><span class="stat-value" id="stat-total">—</span></div>
        <div class="stat"><span class="stat-label">Average score</span><span class="stat-value" id="stat-average">—</span></div>
        <div class="stat"><span class="stat-label">Perfect scores</span><span class="stat-value" id="stat-perfect">—</span></div>
        <div class="stat"><span class="stat-label">Fastest perfect</span><span class="stat-value" id="stat-fastest">—</span></div>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <div class="table-wrap" tabindex="0" role="region" aria-label="Scoreboard, highest score then fastest quiz time">
        <table>
          <thead>
            <tr><th scope="col">Submitted</th><th scope="col">Name</th><th scope="col" class="num">Score</th><th scope="col" class="num">Time</th><th scope="col">Order</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <dialog id="gate" aria-labelledby="gate-title">
    <h2 id="gate-title">Mission Control access</h2>
    <form class="gate-form" id="gate-form">
      <label for="gate-password">Password</label>
      <input type="password" id="gate-password" autocomplete="off" spellcheck="false" required aria-describedby="gate-error">
      <p class="gate-error error" id="gate-error" aria-live="assertive"></p>
      <button type="submit" class="btn btn-primary">Unlock</button>
    </form>
  </dialog>

  <script>
    const ADMIN_API = "https://space-quiz-dxb7dmfrb2hmcfbx.australiaeast-01.azurewebsites.net/api/scores/all";
    // SHA-256 of the admin password. This is only a casual gate: the page is static and the API is public.
    const PASSWORD_SHA256 = "7db2a4aae0c33015a69abaaeb04224c16e2a91aefa143c6056c49772699b9a84";
    const REFRESH_MS = 10000;
    const NEW_HIGHLIGHT_MS = 60000;
    const $ = id => document.getElementById(id);

    let firstSeen = null;
    let timer = null;
    let loading = false;
    let unlocked = false;

    const formatTime = ms => {
      const total = Math.round(ms / 1000);
      return `${String(Math.floor(total / 60)).padStart(2, "0")}:${String(total % 60).padStart(2, "0")}`;
    };
    const formatDate = iso => new Date(iso).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "medium" });

    function setStatus(text, isError = false) {
      $("status").textContent = text;
      $("status").classList.toggle("error", isError);
    }

    function scheduleRefresh() {
      clearInterval(timer);
      timer = unlocked && $("auto-refresh").checked && !document.hidden ? setInterval(loadScores, REFRESH_MS) : null;
      $("live").classList.toggle("on", !!timer);
      $("live-text").textContent = timer ? "Live" : "Paused";
    }

    function renderStats(data) {
      const entries = data.entries;
      $("stat-total").textContent = data.total;
      if (!entries.length) {
        ["stat-average", "stat-perfect", "stat-fastest"].forEach(id => $(id).textContent = "—");
        return;
      }
      const perfect = entries.filter(e => e.score === e.total);
      $("stat-average").textContent = (entries.reduce((sum, e) => sum + e.score, 0) / entries.length).toFixed(1);
      $("stat-perfect").textContent = perfect.length;
      $("stat-fastest").textContent = perfect.length ? formatTime(Math.min(...perfect.map(e => e.timeMs))) : "—";
    }

    function renderRows(entries) {
      const body = $("rows");
      body.replaceChildren();
      if (!entries.length) {
        const cell = body.insertRow().insertCell();
        cell.colSpan = 5;
        cell.className = "empty";
        cell.textContent = "No scores have been submitted yet.";
      }
      // Rows present on the first load are baseline (seen at 0); later arrivals stay highlighted for a minute.
      const initial = firstSeen === null;
      firstSeen ??= new Map();
      const now = Date.now();
      let newCount = 0;
      const ranked = [...entries].sort((a, b) =>
        b.score - a.score || a.timeMs - b.timeMs || new Date(a.date) - new Date(b.date));
      for (const e of ranked) {
        if (!firstSeen.has(e.id)) {
          firstSeen.set(e.id, initial ? 0 : now);
          if (!initial) newCount++;
        }
        const row = body.insertRow();
        const date = row.insertCell();
        date.textContent = formatDate(e.date);
        if (now - firstSeen.get(e.id) < NEW_HIGHLIGHT_MS) {
          row.className = "new";
          const badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = "New";
          date.append(badge);
        }
        const name = row.insertCell();
        name.className = "name";
        name.textContent = e.name;
        const score = row.insertCell();
        score.className = "num mono";
        score.textContent = `${e.score}/${e.total}`;
        const time = row.insertCell();
        time.className = "num mono";
        time.textContent = formatTime(e.timeMs);
        row.insertCell().textContent = e.mode === "shuffled" ? "Shuffled" : "Original";
      }
      return newCount;
    }

    async function loadScores() {
      if (!unlocked || loading) return;
      loading = true;
      $("refresh").disabled = true;
      try {
        const response = await fetch(ADMIN_API, { cache: "no-store" });
        const data = await response.json().catch(() => null);
        if (!response.ok || !data) throw new Error(data?.error || `The API responded with ${response.status}.`);

        renderStats(data);
        const newCount = renderRows(data.entries);
        const fresh = newCount ? ` ${newCount} new submission${newCount === 1 ? "" : "s"}.` : "";
        const shown = data.entries.length < data.total ? ` Showing the top ${data.entries.length}.` : "";
        setStatus(`Updated ${new Date().toLocaleTimeString()}.${fresh}${shown}`);
      } catch (error) {
        setStatus(`Could not load scores (${error.message || "the API is unreachable"}). Retrying on the next refresh.`, true);
      } finally {
        loading = false;
        $("refresh").disabled = false;
      }
    }

    $("refresh").addEventListener("click", loadScores);
    $("auto-refresh").addEventListener("change", scheduleRefresh);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && $("auto-refresh").checked) loadScores();
      scheduleRefresh();
    });

    async function sha256(text) {
      const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
      return Array.from(new Uint8Array(digest), b => b.toString(16).padStart(2, "0")).join("");
    }

    $("gate").addEventListener("cancel", event => event.preventDefault());
    $("gate-form").addEventListener("submit", async event => {
      event.preventDefault();
      const input = $("gate-password");
      if (await sha256(input.value) !== PASSWORD_SHA256) {
        $("gate-error").textContent = "Incorrect password. Try again.";
        input.select();
        return;
      }
      unlocked = true;
      input.value = "";
      $("gate").close();
      $("dashboard").hidden = false;
      $("dashboard-title").focus();
      setStatus("Loading scores…");
      loadScores();
      scheduleRefresh();
    });

    $("gate").showModal();
  </script>
</body>
</html>
